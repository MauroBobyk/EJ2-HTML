<!--
    EJERCICIO 2 - Clases CSS y Botones
    class = "etiqueta" que agrupa varios elementos HTML.
    En CSS se usa con punto: .nombreClase
    Misma clase → mismos estilos para todos los elementos que la compartan.
-->
<!DOCTYPE html>
<html lang="es"> <!-- lang="es" → contenido en español -->
<head>
    <meta charset="UTF-8"> <!-- Permite tildes, ñ y caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la página a celulares/tablets -->
    <title>EJ2 - Botones con Clases</title> <!-- Título de la pestaña del navegador -->
    <link href="styles.css" rel="stylesheet" type="text/css"> 
</head>
<body>
    <div class="centro">
        <h1>Ejemplo de botones</h1>
        <!-- Cada botón está envuelto en un <a> para que al clickearlo navegue a otra página -->
        <a href="pagina1.html"><button class="btn">Botón 1</button></a>
        <a href="pagina2.html"><button class="btn">Botón 2</button></a>
        <a href="pagina3.html"><button class="btn">Botón 3</button></a>
    </div>
    <footer>
        <p>Página realizada por el profesor Mauro Bobyk con fines educativos</p>
    </footer>
</body>
</html>
